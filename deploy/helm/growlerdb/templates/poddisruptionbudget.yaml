# NOTE: deliberately NO PodDisruptionBudget for the HA control plane. Leader-only readiness means
# exactly one CP pod is ever healthy, so ANY budget with desiredHealthy ≥ 1 (e.g. the previous
# `minAvailable: 1`, or even `maxUnavailable: 1` at replicas ≥ 2) computes disruptionsAllowed = 0
# forever and wedges `kubectl drain` on the leader's host. Evicting the leader is safe by design:
# it releases the advisory lock on exit and a warm standby promotes within its 250ms poll — the
# protection a PDB would buy is already provided by fast promotion + pod anti-affinity
# (controlPlane.spreadReplicas), and a CP PDB can only ever block drains.
{{- if and .Values.node.podDisruptionBudget.enabled (gt (int .Values.index.shards) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "growlerdb.node.fullname" . }}
  labels:
    {{- include "growlerdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
spec:
  minAvailable: {{ .Values.node.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "growlerdb.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: node
{{- end }}
---
{{- if and .Values.gateway.podDisruptionBudget.enabled (gt (int .Values.gateway.replicas) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "growlerdb.gateway.fullname" . }}
  labels:
    {{- include "growlerdb.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  minAvailable: {{ .Values.gateway.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "growlerdb.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
{{- end }}
