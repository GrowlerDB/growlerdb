# Workload-generic streaming generator — RENDERED, do not apply directly:
#   python3 bench/scale/harness.py render <workload> --shards N   (or deploy/k8s/scale-up.sh)
# The workload's own corpus.py is mounted from the ConfigMap below and its `stream()` runs —
# the row recipe lives in exactly one place per workload (bench/scale/workloads/<name>/corpus.py),
# shared with the harness's bulk `load`. BATCH rows/commit every SLEEP_S; relax SLEEP_S (30-60s)
# with a big BATCH to crank ingest throughput (staged_run.py drives both via `kubectl set env`).
# Workload-specific knobs (e.g. the windowed corpus's LOGS_PER_DAY) are plain env vars read by
# corpus.py — add them with `kubectl set env deploy/growlerdb-generator`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: growlerdb-workload-corpus
  namespace: ${NAMESPACE}
  labels: { app: growlerdb-generator }
data:
  corpus.py: |
${CORPUS_PY}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: growlerdb-generator
  namespace: ${NAMESPACE}
  labels: { app: growlerdb-generator }
spec:
  # Parallelize ingest by running N generator pods. corpus.py is SEEDED (byte-reproducible), so each
  # pod derives a distinct BENCH_SEED from its HOSTNAME (see the container args) → replicas produce
  # DISJOINT ids/data with no collision, and aggregate rows/s scales ~linearly. Reproducibility across
  # a full run is via the archived artifact (bucket), not the seed alone — HOSTNAMEs vary per run.
  # Rendered by `harness.py render --generators N`.
  replicas: ${GENERATORS}
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: growlerdb-generator }
  template:
    metadata:
      labels: { app: growlerdb-generator }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      volumes:
        - name: workload-corpus
          configMap: { name: growlerdb-workload-corpus }
      containers:
        - name: generator
          image: ghcr.io/growlerdb/growlerdb-seed:dev
          imagePullPolicy: Always
          volumeMounts:
            - { name: workload-corpus, mountPath: /workload }
          ports:
            - { name: metrics, containerPort: 9109 }
          command: ["python", "-c"]
          args:
            - |
              import os, sys
              sys.path.insert(0, "/workload")   # the mounted workload corpus.py
              sys.path.insert(0, "/")           # genmetrics.py (baked into the seed image)
              # Serve the uncompressed-corpus-bytes counters so the harness sizes milestones +
              # index:source against the real raw corpus, not a hardcoded RAW_ROW_BYTES (TASK-342).
              try:
                  import genmetrics
                  genmetrics.serve(int(os.environ.get("METRICS_PORT", "9109")))
              except Exception as e:  # never let telemetry stop ingest
                  print("genmetrics unavailable:", e, flush=True)
              # Per-pod seed so parallel replicas produce DISJOINT rows. corpus.py reads BENCH_SEED at
              # import, so without a distinct seed every replica emits identical ids/data. This is a
              # Deployment (all pods share this spec) → derive the seed from the pod name (HOSTNAME).
              # Must be set BEFORE `import corpus`. Set BENCH_SEED explicitly to pin one reproducible pod.
              import hashlib
              if not os.environ.get("BENCH_SEED"):
                  os.environ["BENCH_SEED"] = str(int(
                      hashlib.sha256(os.environ.get("HOSTNAME", "gen").encode()).hexdigest()[:12], 16))
              print("BENCH_SEED", os.environ["BENCH_SEED"], "HOSTNAME", os.environ.get("HOSTNAME"), flush=True)
              import corpus
              corpus.stream(table=os.environ["TABLE"],
                            batch=int(os.environ["BATCH"]),
                            sleep_s=int(os.environ["SLEEP_S"]))
          env:
            - { name: TABLE, value: "${TABLE}" }
            - { name: BATCH, value: "10" }
            - { name: SLEEP_S, value: "5" }
            - { name: POLARIS_URI, value: "http://polaris:8181/api/catalog" }
            - { name: POLARIS_CATALOG, value: "growlerdb" }
            - { name: POLARIS_CREDENTIAL, value: "root:s3cr3t" }
            - { name: AWS_ENDPOINT_URL_S3, value: "${S3_ENDPOINT}" }
            - { name: AWS_ACCESS_KEY_ID, value: "${S3_ACCESS_KEY}" }
            - { name: AWS_SECRET_ACCESS_KEY, value: "${S3_SECRET_KEY}" }
