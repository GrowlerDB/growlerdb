[package]
name = "growlerdb-cli"
description = "The GrowlerDB command-line interface (embedded mode)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "growlerdb_cli"
path = "src/lib.rs"

[[bin]]
name = "growlerdb"
path = "src/main.rs"

[dependencies]
growlerdb-core.workspace = true
growlerdb-controlplane.workspace = true
growlerdb-engine.workspace = true
growlerdb-index.workspace = true
growlerdb-backup.workspace = true
growlerdb-source.workspace = true
growlerdb-proto.workspace = true
growlerdb-telemetry.workspace = true
growlerdb-mcp.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tracing.workspace = true
tonic.workspace = true
axum = "0.8"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "time"] }

[features]
# Enable the externalized Postgres registry backend so `control-plane --registry-postgres <url>` can
# run N stateless replicas over a shared store (D51). Off by default — the default build keeps the
# embedded single-writer JSON registry and pulls in no Postgres client.
postgres = ["growlerdb-controlplane/postgres"]

[dev-dependencies]
growlerdb-proto.workspace = true
growlerdb-client.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
