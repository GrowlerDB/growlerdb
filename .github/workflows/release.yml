name: release

# Cut a release two ways (see RELEASING.md):
#   - workflow_dispatch with `bump: patch|minor|major` — the gate runs, then the next version is
#     computed from the last `v*` tag and the tag is created for you.
#   - pushing a `v*` SemVer tag by hand — uses that tag verbatim.
# Either way it publishes a signed multi-arch container + SBOM, the Helm chart (OCI), and release
# binaries with checksums. Artifacts are tag-derived; the in-tree workspace version stays 0.0.0.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump from the last released tag (ignored for the first release → 0.1.0)"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write # create the GitHub Release + upload assets, and push the computed tag
  packages: write # push image + chart to GHCR
  id-token: write # cosign keyless signing via GitHub OIDC

env:
  REGISTRY: ghcr.io

jobs:
  # The full CI gate must pass before anything is published (and before a dispatch tag is created).
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # Resolve the release version (and, for a dispatch, create the tag) only after the gate is green,
  # so a failing gate never leaves an orphan tag behind. Outputs feed every publishing job.
  version:
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      major: ${{ steps.v.outputs.major }}
      minor: ${{ steps.v.outputs.minor }}
      image: ${{ steps.v.outputs.image }}
      owner_lc: ${{ steps.v.outputs.owner_lc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need the full tag history to compute the next version
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$(scripts/next-version.sh "${{ inputs.bump }}")"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v${version}" -m "v${version}"
            git push origin "v${version}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          major="${version%%.*}"; rest="${version#*.}"; minor="${rest%%.*}"
          # GHCR / OCI paths must be lowercase; the org login (github.repository[_owner]) may not be.
          repo_lc="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=${version}"
            echo "major=${major}"
            echo "minor=${minor}"
            echo "image=ghcr.io/${repo_lc}"
            echo "owner_lc=${owner_lc}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v${version} (image ghcr.io/${repo_lc})"

  # Build each arch on its NATIVE hosted runner — no QEMU emulation (the arm64 QEMU build was the
  # slow leg). Each pushes by digest with a buildx GHA layer cache (per-arch scope); `merge` then
  # assembles the multi-arch manifest. (If `ubuntu-24.04-arm` isn't available on the plan, the arm64
  # leg will queue — fall back to a single QEMU build.)
  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ${{ needs.version.outputs.image }} # lowercased ghcr.io/<owner>/<repo>
      DOCKER_BUILD_RECORD_UPLOAD: "false" # skip the *.dockerbuild build-record artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare platform name
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push by digest (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            GROWLERDB_VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-arch digests into one tagged multi-arch manifest, then sign + SBOM the manifest.
  merge:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ needs.version.outputs.image }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Immutable X.Y.Z + moving X.Y, X, and latest so consumers can pin exactly or float.
      - name: Create + push the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          # Each digest artifact is a file named after its sha256 hex (see the build job).
          srcs=()
          for f in *; do srcs+=("${IMAGE}@sha256:${f}"); done
          docker buildx imagetools create \
            -t "${IMAGE}:${{ needs.version.outputs.version }}" \
            -t "${IMAGE}:${{ needs.version.outputs.major }}.${{ needs.version.outputs.minor }}" \
            -t "${IMAGE}:${{ needs.version.outputs.major }}" \
            -t "${IMAGE}:latest" \
            "${srcs[@]}"
      - name: Resolve the manifest digest
        id: digest
        run: |
          d=$(docker buildx imagetools inspect "${IMAGE}:${{ needs.version.outputs.version }}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${d}" >> "$GITHUB_OUTPUT"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the manifest (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.digest.outputs.digest }}"
      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Attest the SBOM to the manifest
        run: cosign attest --yes --predicate sbom.cdx.json --type cyclonedx "${IMAGE}@${{ steps.digest.outputs.digest }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json

  helm:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Login to GHCR (OCI registry)
        run: helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
      # The chart keeps its own SemVer (Chart.yaml `version`); only appVersion tracks the release.
      - name: Package + push the chart
        run: |
          helm package deploy/helm/growlerdb --app-version "${{ needs.version.outputs.version }}" -d dist
          helm push dist/growlerdb-*.tgz oci://${{ env.REGISTRY }}/${{ needs.version.outputs.owner_lc }}/charts

  # Build each release binary on its NATIVE per-arch runner (no `cross`). The local embedder links a
  # native `libonnxruntime` (the `ort` crate's `download-binaries`), whose prebuilt needs glibc 2.38+
  # that the `cross` containers don't have — so a `cross` build fails to link ONNX ("could not find
  # native static library `onnxruntime`"). Native runners match the container image build's toolchain,
  # so the binary links ONNX exactly like the published image. (Binaries therefore require glibc 2.38+
  # at runtime, same floor as the image.)
  binaries:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Build the release binary
        env:
          GROWLERDB_VERSION: ${{ needs.version.outputs.version }}
        # Native build for the host's own target triple — no `--target` cross toolchain needed.
        run: cargo build --release --locked -p growlerdb-cli --target ${{ matrix.target }}
      - name: Stage + checksum
        run: |
          mkdir -p dist
          bin=target/${{ matrix.target }}/release/growlerdb
          out=dist/growlerdb-${{ matrix.target }}
          cp "$bin" "$out"
          sha256sum "$out" > "$out.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: dist/*

  # Integration artifacts: the JVM connector fat jars, so a data engineer can download a ready-to-run
  # jar from the Release instead of cloning + building Java. Spark (JDK 21) and Trino (JDK 25) each
  # carry their own mise toolchain. The jars are version-stamped to the release tag (`versions:set`),
  # like the tag-derived binaries — the in-tree pom stays 0.0.0.
  connectors:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Cache Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: m2-release-${{ hashFiles('connector/pom.xml', 'connector-trino/pom.xml') }}
          restore-keys: m2-
      - name: Build the Spark connector fat jar (JDK 21)
        working-directory: connector
        run: |
          mise install
          mise exec -- mvn -B -q versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false
          mise exec -- mvn -B -q -DskipTests package
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - name: Build the Trino connector fat jar (JDK 25)
        working-directory: connector-trino
        run: |
          mise install
          mise exec -- mvn -B -q versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false
          mise exec -- mvn -B -q -DskipTests package
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - name: Stage + checksum the jars
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p dist
          cp "connector/target/growlerdb-connector-${VERSION}.jar" dist/
          cp "connector-trino/target/growlerdb-trino-connector-${VERSION}.jar" dist/
          ( cd dist && for j in *.jar; do sha256sum "$j" > "$j.sha256"; done )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: connector-jars
          path: dist/*
          if-no-files-found: error

  # Package the pure-Python client (stdlib-only → a universal wheel + sdist). The client keeps its
  # OWN SemVer (growlerdb/__init__.py `__version__`), independent of the tag-derived engine version
  # (see RELEASING.md), so it is not stamped here.
  python-client:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the wheel + sdist
        working-directory: clients/python
        run: |
          python3 -m pip install --upgrade build
          python3 -m build --outdir dist .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-client
          path: clients/python/dist/*
          if-no-files-found: error

  # Publish the Python client to PyPI via Trusted Publishing (OIDC, no stored token). Opt-in: set the
  # repo variable PUBLISH_PYPI=true once the PyPI project + trusted publisher are configured (see
  # RELEASING.md). Until then the wheel/sdist still ship as Release assets, so `pip install <url>`
  # works. A failure here never blocks the Release (this job is not in `release`'s `needs`).
  pypi:
    needs: [version, python-client]
    if: ${{ vars.PUBLISH_PYPI == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-client
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # A pre-configured Spark image with the connector fat jar baked in, so ingestion runs without a
  # host-side Java/Maven build (TASK-296 AC#4). Same Dockerfile as the scale-test `:dev` image; here
  # it gets released tags. amd64 only — Spark clusters are amd64, matching the scale image.
  connector-image:
    needs: version
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ needs.version.outputs.owner_lc }}/growlerdb-connector
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push the connector image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/k8s/streaming/connector.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE }}:${{ needs.version.outputs.major }}.${{ needs.version.outputs.minor }}
            ${{ env.IMAGE }}:${{ needs.version.outputs.major }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=connector-image
          cache-to: type=gha,scope=connector-image,mode=max

  release:
    needs: [version, merge, helm, binaries, connectors, python-client]
    runs-on: ubuntu-latest
    steps:
      # Only the release assets — NOT the internal digests-* or docker/build-push-action's
      # auto-uploaded *.dockerbuild build records (downloading those flaked the job). Binaries, the
      # SBOM, the connector fat jars, and the Python wheel/sdist (all named `growlerdb-*`).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: "{bin-*,sbom,connector-jars,python-client}"
      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          # `growlerdb-*` covers the binaries, connector jars (growlerdb[-trino]-connector-*.jar),
          # and the Python wheel/sdist (growlerdb-*.whl / growlerdb-*.tar.gz) plus their .sha256.
          files: |
            artifacts/**/growlerdb-*
            artifacts/**/sbom.cdx.json
